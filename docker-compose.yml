services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthome
      POSTGRES_USER: healthome
      POSTGRES_PASSWORD: healthome_dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - healthome_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthome -d healthome"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  healthome_postgres:
